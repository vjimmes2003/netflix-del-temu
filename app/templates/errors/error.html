{% extends "base.html" %}

{% block title %}
{{ error_code }} — Netflix del Temu
{% endblock %}


{% block content %}

<main class="error-page">

    <section class="error-card">

        <p class="error-code">
            {{ error_code }}
        </p>

        <h1 class="error-title">
            {{ error_title }}
        </h1>

        <p class="error-description">
            {{ error_message }}
        </p>

        <div class="actions">

            {% if current_user.is_authenticated %}

                <a
                    href="{{ url_for('catalog.catalog') }}"
                    class="button button-primary"
                >
                    Volver al catálogo
                </a>

            {% else %}

                <a
                    href="{{ url_for('index') }}"
                    class="button button-primary"
                >
                    Volver al inicio
                </a>

            {% endif %}

        </div>

    </section>

</main>

{% endblock %}
